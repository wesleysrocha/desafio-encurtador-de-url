<header class="topbar">
  <div class="container topbar-inner">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M10 14l4-4M8.5 11.5l-1.8 1.8a3 3 0 004.2 4.2l1.8-1.8M15.5 12.5l1.8-1.8a3 3 0 00-4.2-4.2l-1.8 1.8"
                stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
      </span>
      <span>Encurtador</span>
    </div>
    <a class="docs" href="http://localhost:8080/swagger" target="_blank" rel="noopener">API (Swagger)</a>

</header>

<section class="hero">
  <div class="container">
    <h1>Links curtos, resultados rápidos</h1>
    <p>Transforme URLs longas em links curtos, compartilhe e acompanhe quantos cliques cada um recebeu.</p>
  </div>
</section>

<main class="container content">
  <app-shorten-form (changed)="onChanged()" />
  <app-url-list />
</main>

<footer class="container footer">
  Desafio Encurtador de URL · Angular + .NET 8 + MySQL
</footer>
